<!doctype html>
<html><head><meta charset="utf-8"><title>Fixture: Amazon-style product page</title></head>
<body>
<div id="dp">
  <span id="productTitle">Stainless Steel Water Bottle, 32 oz, Vacuum Insulated</span>
  <div id="dealBadge_feature_div"><span class="a-size-small">Limited time deal</span></div>
  <div id="deal-timer"><span class="a-size-base">Ends in </span><span id="dealCountdown">{{hms}}</span></div>
  <span class="a-price"><span class="a-offscreen">$24.99</span><span aria-hidden="true">$24<sup>99</sup></span></span>
  <div id="availability"><span class="a-color-price">Only {{stock}} left in stock - order soon.</span></div>
  <div id="social-proofing-faceout-title-tk_bought"><span class="a-text-bold">{{bought}} bought</span><span> in past month</span></div>
  <div id="mir-layout-DELIVERY_BLOCK"><span>FREE delivery <b>Tomorrow</b>. Order within <span id="ftCountdown">{{cut}}</span></span></div>
</div>
</body></html>
