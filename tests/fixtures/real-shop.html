<!doctype html>
<html><head><meta charset="utf-8"><title>Fixture: honest flash sale, Lazada-style markup</title></head>
<body>
<div class="pdp-block">
  <div class="pdp-mod-product-badge-title">Rice Cooker 1.8L, non-stick inner pot</div>
  <div class="pdp-price">₱1,299.00 <del>₱1,899.00</del></div>
  <div class="fs-timer"><span class="fs-label">Ends in</span> <span class="fs-left">{{h}}h {{m}}m {{s}}s</span></div>
  <div class="pdp-viewers">{{viewers}} people are viewing this</div>
  <div class="quantity-content-default">Only {{stock}} items left</div>
  <div class="mega">Mega sale ends 2026-11-11 23:59:59</div>
  <div class="voucher">Store voucher: <span>{{vdays}} days left</span></div>
</div>
</body></html>
